image: ghcr.io/cirruslabs/flutter:stable

stages:
  - release

variables:
  GITHUB_REPOSITORY: "v4rdhan/MusicApp-Flutter"

release_android:
  stage: release
  resource_group: github-release
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - |
      set -eu

      if [ -z "${GITHUB_TOKEN:-}" ]; then
        echo "GITHUB_TOKEN must be configured as a masked GitLab CI/CD variable."
        exit 1
      fi

      BASE_VERSION="$(sed -n 's/^version: *//p' pubspec.yaml)"
      if ! printf '%s' "$BASE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$'; then
        echo "Expected pubspec.yaml version in major.minor.patch+build format."
        exit 1
      fi

      TAGS_JSON="$(curl --fail --silent --show-error \
        --header "Authorization: Bearer ${GITHUB_TOKEN}" \
        --header "Accept: application/vnd.github+json" \
        --header "X-GitHub-Api-Version: 2022-11-28" \
        "https://api.github.com/repos/${GITHUB_REPOSITORY}/tags?per_page=100")"
      NEXT_VERSION="$(printf '%s' "$TAGS_JSON" | python3 -c '
      import json
      import re
      import sys

      pattern = re.compile(r"^v?([0-9]+)\.([0-9]+)\.([0-9]+)\+([0-9]+)$")
      baseline = pattern.fullmatch(sys.argv[1])
      if not baseline:
          raise SystemExit("Expected pubspec.yaml version in major.minor.patch+build format.")
      versions = [tuple(map(int, baseline.groups()))]
      for tag in json.load(sys.stdin):
          match = pattern.fullmatch(tag["name"])
          if match:
              versions.append(tuple(map(int, match.groups())))
      major, minor, patch, build = max(versions)
      print(f"{major}.{minor}.{patch + 1}+{build + 1}")
      ' "$BASE_VERSION")"
      TAG="v${NEXT_VERSION}"
      BUILD_NAME="${NEXT_VERSION%%+*}"
      BUILD_NUMBER="${NEXT_VERSION##*+}"
      APK_NAME="music_app-${BUILD_NAME}-${BUILD_NUMBER}.apk"

      flutter pub get
      flutter build apk --release \
        --build-name "$BUILD_NAME" \
        --build-number "$BUILD_NUMBER"

      APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
      RELEASE_BODY="$(python3 -c '
      import json
      import sys
      print(json.dumps({
          "tag_name": sys.argv[1],
          "target_commitish": sys.argv[2],
          "name": sys.argv[1],
          "body": "Android APK build for " + sys.argv[1] + "."
      }))
      ' "$TAG" "$CI_COMMIT_SHA")"
      RELEASE_JSON="$(curl --fail --silent --show-error \
        --header "Authorization: Bearer ${GITHUB_TOKEN}" \
        --header "Accept: application/vnd.github+json" \
        --header "X-GitHub-Api-Version: 2022-11-28" \
        --header "Content-Type: application/json" \
        --data "$RELEASE_BODY" \
        "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases")"
      UPLOAD_URL="$(printf '%s' "$RELEASE_JSON" | python3 -c '
      import json
      import sys
      print(json.load(sys.stdin)["upload_url"].split("{", 1)[0])
      ')"

      curl --fail --silent --show-error \
        --header "Authorization: Bearer ${GITHUB_TOKEN}" \
        --header "Accept: application/vnd.github+json" \
        --header "Content-Type: application/vnd.android.package-archive" \
        --data-binary "@${APK_PATH}" \
        "${UPLOAD_URL}?name=${APK_NAME}"
      echo "Published ${TAG} with ${APK_NAME}"
  artifacts:
    name: "android-${CI_COMMIT_SHORT_SHA}"
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
    expire_in: 30 days
